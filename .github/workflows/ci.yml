name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio PyYAML
      - name: Run test suite
        # Tests stub the Claude Agent SDK (tests/conftest.py) so they run with no
        # network, no API key, and no live agent — pure logic checks of the guard
        # policy, evidence chain, queue, control-plane boundary, and containment.
        run: pytest tests/ -v
